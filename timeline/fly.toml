# One always-on machine: SSE, app machines, session locks and image variants
# are all in-process, so every request must reach the same process.
# Secrets: fly secrets set STATOR_SECRET=… SITE_OWNER_EMAIL=… RESEND_API_KEY=…
#   SITE_ENCRYPTION_KEY=… REDIS_URL=…

app = 'my-timeline-site'
primary_region = 'ord'

[build]
  dockerfile = 'Dockerfile'

[env]
  NODE_ENV = 'production'
  SITE_ORIGIN = 'https://example.com'
  SITE_NAME = 'My Site'
  SITE_AUTHOR = 'Your Name'
  SITE_DB = '/data/site.db'
  SITE_MEDIA = '/data/media'
  SITE_OUTBOUND = '1'

[mounts]
  source = 'data'
  destination = '/data'

[http_service]
  internal_port = 3000
  force_https = true
  auto_stop_machines = 'off'
  auto_start_machines = false
  min_machines_running = 1
  max_machines_running = 1
  processes = ['app']

[[vm]]
  size = 'shared-cpu-1x'
  memory = '512mb'

swap_size_mb = 512
